<div class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <!-- Background overlay -->
        <div class="fixed inset-0 bg-slate-900 bg-opacity-75 transition-opacity" aria-hidden="true" onclick="document.getElementById('modal-container').innerHTML=''"></div>
        
        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

        <!-- Modal panel -->
        <div class="inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full border border-slate-200">
            <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                <div class="sm:flex sm:items-start">
                    <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                        <h3 class="text-lg leading-6 font-bold text-slate-900" id="modal-title">添加监控资产</h3>
                        <div class="mt-2 text-sm text-slate-500">
                            选择您要监控的数据类型。对于域名监控，需要您拥有管理员权限以完成 HIBP DNS 所有权验证。
                        </div>
                        
                        <form id="add-asset-form"  class="mt-6 space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700">资产类型</label>
                                <select name="asset_type" id="asset-type-select" onchange="updateAssetForm()" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-slate-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-xl border">
                                    <option value="email">电子邮箱 (Email)</option>
                                    <option value="domain">网站域名 (Domain)</option>
                                    <option value="username">用户名 (Username)</option>
                                    <option value="password">密码 (Password)</option>
                                    <option value="api_key">API 密钥 (API Key)</option>
                                    <option value="token">令牌 (Token)</option>
                                </select>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-slate-700">资产名称 (可选)</label>
                                <input type="text" name="label" placeholder="例如：公司主域名" class="mt-1 appearance-none block w-full px-3 py-2 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-slate-700">监控值 / 域名</label>
                                <input type="text" id="asset-value" name="value" required placeholder="example.com 或 user@example.com" autocomplete="off" class="mt-1 appearance-none block w-full px-3 py-2 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                            </div>
                            
                            <div id="domain-hint" class="hidden mt-4 bg-amber-50 p-4 rounded-xl border border-amber-200 flex gap-3">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-600 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                                <div class="text-xs text-amber-800">
                                    <p class="font-bold">域名验证要求</p>
                                    <p class="mt-1">添加域名后，系统状态将变为“待验证”。您必须前往 <a href="https://haveibeenpwned.com/DomainSearch" target="_blank" class="underline text-blue-600 hover:text-blue-800">HIBP 官网</a> 完成 DNS TXT 记录验证，然后在此系统点击“完成验证”。系统才会在后续任务中扫描该域名。</p>
                                </div>
                            </div>
                            <div id="site-scope" class="space-y-3 rounded-xl border border-slate-200 p-4">
                                <label class="block text-sm font-medium text-slate-700">监控范围</label>
                                <select name="site_filter_mode" id="site-filter-mode" onchange="toggleWatchedSites()" class="w-full px-3 py-2 border rounded-xl"><option value="all">全网监控</option><option value="only">仅关注指定网站</option></select>
                                <textarea name="watched_sites_text" id="watched-sites" rows="3" placeholder="每行一个，例如：\nexample.com\n*.example.com" class="hidden w-full px-3 py-2 border rounded-xl text-sm"></textarea>
                                <p id="username-site-tip" class="hidden text-xs text-amber-700">用户名重名率较高，建议选择“仅关注指定网站”。</p>
                            </div>
                            
                            <div id="modal-error" class="text-rose-600 text-sm hidden"></div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="bg-slate-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse rounded-b-2xl">
                <button type="button" onclick="submitAddAsset()" class="w-full inline-flex justify-center rounded-xl border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:ml-3 sm:w-auto sm:text-sm transition-colors">
                    确认添加
                </button>
                <button type="button" onclick="document.getElementById('modal-container').innerHTML=''" class="mt-3 w-full inline-flex justify-center rounded-xl border border-slate-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm transition-colors">
                    取消
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function updateAssetForm() {
        const val = document.getElementById('asset-type-select').value;
        const hint = document.getElementById('domain-hint');
        const input = document.getElementById('asset-value');
        if (val === 'domain') {
            hint.classList.remove('hidden');
        } else {
            hint.classList.add('hidden');
        }
        const sensitive = ['password', 'api_key', 'token'].includes(val);
        input.type = sensitive ? 'password' : 'text';
        input.placeholder = sensitive ? '输入敏感值（保存后仅显示为掩码）' : 'example.com 或 user@example.com';
        document.getElementById('site-scope').classList.toggle('hidden', sensitive);
        document.getElementById('username-site-tip').classList.toggle('hidden', val !== 'username');
        if (sensitive) document.getElementById('site-filter-mode').value = 'all';
        toggleWatchedSites();
    }
    function toggleWatchedSites(){document.getElementById('watched-sites').classList.toggle('hidden', document.getElementById('site-filter-mode').value !== 'only')}
    
    function submitAddAsset() {
        const form = document.getElementById('add-asset-form');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        data.watched_sites = (data.watched_sites_text || '').split(/[,\n]/).map(x => x.trim()).filter(Boolean);
        delete data.watched_sites_text;
        
        fetch('/api/assets/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + localStorage.getItem('access_token')
            },
            body: JSON.stringify(data)
        }).then(async res => {
            if(res.ok) {
                document.getElementById('modal-container').innerHTML='';
                htmx.ajax('GET', '/views/assets', {target: '#main-content'});
            } else {
                const err = await res.json();
                const errDiv = document.getElementById('modal-error');
                errDiv.classList.remove('hidden');
                errDiv.innerText = err.detail || '添加失败';
            }
        });
    }
    updateAssetForm();
</script>
