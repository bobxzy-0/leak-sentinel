<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{{ app_name }}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900">
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
            <div class="text-lg font-bold flex items-center gap-3 text-slate-800">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                {{ app_name }}
            </div>
            <div class="flex items-center space-x-8">
                <div class="space-x-8 text-sm font-medium text-slate-600">
                    <a href="/" class="hover:text-blue-600 transition-colors">仪表盘</a>
                    <a href="/assets" class="hover:text-blue-600 transition-colors">监控资产</a>
                    <a href="/settings" class="hover:text-blue-600 transition-colors">系统设置</a>
                </div>
                {% if current_user %}
                <div class="flex items-center gap-4 pl-8 border-l border-slate-200">
                    <div class="text-sm">
                        <p class="font-medium text-slate-700">{{ current_user.display_name or current_user.email.split('@')[0] }}</p>
                        <p class="text-xs text-slate-400">{{ current_user.email }}</p>
                    </div>
                    <button hx-post="/api/auth/logout" hx-swap="none" class="text-sm text-slate-500 hover:text-rose-600 font-medium transition-colors">
                        退出
                    </button>
                </div>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-6 py-10">
        {% block content %}{% endblock %}
    </main>
    <script>
        document.body.addEventListener('htmx:afterRequest', function(evt) {
            if (evt.detail.elt.hasAttribute('hx-post') && evt.detail.elt.getAttribute('hx-post') === '/api/auth/logout') {
                window.location.href = '/login';
            }
        });
    </script>
</body>
</html>
