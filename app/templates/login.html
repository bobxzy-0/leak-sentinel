<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 - {{ app_name }}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans SC', sans-serif; }</style>
</head>
<body class="bg-slate-50 antialiased h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8 selection:bg-blue-100 selection:text-blue-900">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="flex justify-center text-blue-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
        </div>
        <h2 class="mt-6 text-center text-3xl font-extrabold text-slate-900 tracking-tight">{{ app_name }}</h2>
        <p class="mt-2 text-center text-sm text-slate-500">请输入您的管理员账号</p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow-sm border border-slate-200 sm:rounded-2xl sm:px-10">
            <form id="login-form" hx-post="/api/auth/login" hx-swap="none" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700">账号 (Email)</label>
                    <div class="mt-1">
                        <input id="username" name="username" type="email" required class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700">密码</label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" required class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>

                <div id="error-message" class="text-rose-600 text-sm hidden"></div>

                <div>
                    <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                        登 录
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.body.addEventListener('htmx:afterRequest', function(evt) {
            if(evt.detail.xhr.status === 200 && evt.detail.requestConfig.path === '/api/auth/login') {
                try {
                    const res = JSON.parse(evt.detail.xhr.response);
                    localStorage.setItem('access_token', res.access_token);
                    window.location.href = "/";
                } catch(e) {
                    // ignore
                }
            } else if (evt.detail.xhr.status !== 200) {
                const errDiv = document.getElementById('error-message');
                errDiv.classList.remove('hidden');
                try {
                    const res = JSON.parse(evt.detail.xhr.response);
                    errDiv.innerText = res.detail || '登录失败，请重试';
                } catch(e) {
                    errDiv.innerText = '登录失败，请重试';
                }
            }
        });
    </script>
</body>
</html>
