{% extends "base.html" %}
{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-bold text-slate-900 tracking-tight">系统设置</h1>
    <p class="text-slate-500 mt-2 text-sm">全局监控策略与 HIBP 接口配置</p>
</div>

<div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden max-w-3xl">
    <div class="p-8">
        <h2 class="text-xl font-bold text-slate-900 mb-2">HIBP 订阅配置</h2>
        <p class="text-sm text-slate-500 mb-8">配置您的 Have I Been Pwned (HIBP) 官方 API 密钥以解锁邮箱与域名级的高级监控。</p>
        
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-8 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-2.5 h-2.5 rounded-full bg-slate-400"></div>
                <span class="text-sm font-semibold text-slate-700">当前处于免费模式</span>
            </div>
            <span class="text-xs text-slate-500">仅启用基础密码检测与泄露目录同步</span>
        </div>
        
        <form>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-slate-700 mb-2">API 密钥 (API Key)</label>
                <input type="password" placeholder="请输入 32 位十六进制密钥" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors text-sm placeholder-slate-400">
            </div>
            <div class="mb-8">
                <label class="block text-sm font-semibold text-slate-700 mb-2">请求速率限制 (RPM)</label>
                <input type="number" value="10" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors text-sm text-slate-700">
                <p class="text-xs text-slate-400 mt-2">请参考您在 HIBP 官网订阅的实际套餐上限（如 Core 套餐为 10 RPM）。</p>
            </div>
            <div class="flex gap-4 pt-4 border-t border-slate-100">
                <button type="button" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl text-sm font-medium transition-colors shadow-sm">
                    保存配置
                </button>
                <button type="button" class="bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 px-6 py-2.5 rounded-xl text-sm font-medium transition-colors">
                    测试连接
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
